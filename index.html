<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyn's Handmade Accessories</title>

<style>
body {
  background-color: #fdf2f4;
  font-family: 'Trebuchet MS', sans-serif;
  text-align: center;
  padding: 20px;
  color: #333;
}

.container {
  background: white;
  max-width: 650px;
  margin: 0 auto;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
  color: #b8860b;
  border-bottom: 2px solid #b8860b;
  display: inline-block;
  padding-bottom: 10px;
}

.slogan {
  color: #5d5d5d;
  font-style: italic;
  margin-bottom: 30px;
}

ul {
  list-style-type: "✨ ";
  text-align: left;
  display: inline-block;
}

li {
  margin: 15px 0;
  font-size: 1.2em;
}

.price {
  color: #b8860b;
  font-weight: bold;
}

.registration-form {
  margin-top: 40px;
  text-align: left;
  background: #f9f9f9;
  padding: 25px;
  border-radius: 15px;
}

.form-group {
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background-color: #b8860b;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 8px;
  width: 100%;
}

.contact-section {
  margin-top: 30px;
}

a {
  color: #b8860b;
  font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<h1>Lyn's Handmade Accessories</h1>
<p class="slogan">Handmade accessories made with love.</p>

<ul>
<li>Magical Pink Phone Charm <span class="price">₱70</span></li>
<li>Song Inspired Bracelet <span class="price">₱65</span></li>
<li>Divine Aura Necklace <span class="price">₱85</span></li>
</ul>

<div class="registration-form">

<h2>Join Our Member's Club</h2>

<form>

<div class="form-group">
<label>Full Name:</label>
<input type="text" placeholder="Enter your name">
</div>

<div class="form-group">
<label>Email Address:</label>
<input type="email" placeholder="Enter your email">
</div>

<div class="form-group">
<label>Favorite Accessory:</label>
<select>
<option>Phone Charms</option>
<option>Bracelets</option>
<option>Necklaces</option>
</select>
</div>

<button type="submit">Sign Up Now</button>

</form>
</div>

<div class="contact-section">
<p>Contact us: 
<a href="https://www.facebook.com/share/16r9KAq4Wn/">Visit Our Facebook</a>
</p>
</div>

</div>

</body>
</html>
